<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Delish Creative OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: farm-to-launch workbench — grouped nav rail left, one working surface right; rail becomes a scrolling top bar on phones */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --sunk:#E9ECE4; --line:#D6DBCF;
  --ink:#17211C; --muted:#5D6A62; --accent:#2E7A4E; --accent-ink:#FFFFFF; --accent-soft:#DDEDE2;
  --mango:#A87206; --mango-soft:#F7EBCB; --chili:#C2452A; --chili-soft:#F6DED7; --sky:#2D6C9E; --sky-soft:#DCE8F2;
  --fb:#3A62B5; --ig:#B8467A; --tt:#1E1E1E; --line-oa:#239B4F; --yt:#C23A2B; --plum:#7A4FA8;
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201B; --sunk:#202A23; --line:#2E3A32;
  --ink:#E7EDE8; --muted:#9AA79F; --accent:#5DBB84; --accent-ink:#0E1A13; --accent-soft:#1F3A2A;
  --mango:#E6B34A; --mango-soft:#3A2F14; --chili:#E8785E; --chili-soft:#3D221B; --sky:#7FB3DE; --sky-soft:#1C2E3D;
  --fb:#7D9BE0; --ig:#E07FAE; --tt:#D8D8D8; --line-oa:#5BCB84; --yt:#EE7A6B; --plum:#B596DA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201B; --sunk:#202A23; --line:#2E3A32;
  --ink:#E7EDE8; --muted:#9AA79F; --accent:#5DBB84; --accent-ink:#0E1A13; --accent-soft:#1F3A2A;
  --mango:#E6B34A; --mango-soft:#3A2F14; --chili:#E8785E; --chili-soft:#3D221B; --sky:#7FB3DE; --sky-soft:#1C2E3D;
  --fb:#7D9BE0; --ig:#E07FAE; --tt:#D8D8D8; --line-oa:#5BCB84; --yt:#EE7A6B; --plum:#B596DA; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sky)}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:0;padding-left:6px}
.brand b{font-family:var(--display);font-size:19px}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup > small{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.nv{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
.nv:hover{background:var(--sunk);color:var(--ink)}
.nv[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nv svg{width:17px;height:17px;flex:none}
.nv .badge{margin-left:auto;background:var(--chili);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;font-weight:600}
.railfoot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-left:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;flex:none}
.dot.on{background:var(--accent)} .dot.warn{background:var(--mango)} .dot.off{background:var(--chili)}
main{padding-block:26px 70px;padding-left:max(16px,2.5vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.5vw);min-width:0}
.view{display:flex;flex-direction:column;gap:20px;max-width:1240px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vhead h1{font-size:27px}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel > h2,.panel .ph{font-size:16px;margin-bottom:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph h2{font-size:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.side{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:16px;align-items:start}
.side.r{grid-template-columns:minmax(0,1fr) minmax(260px,330px)}
.side.l{grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.4}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--chili)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f .hint{font-weight:400;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],input[type=datetime-local],input[type=url],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;color:var(--ink);font-size:14px;min-width:0}
textarea{resize:vertical;min-height:72px}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row > label.f{flex:1 1 150px}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{position:relative}
.chk input{position:absolute;opacity:0}
.chk span{display:inline-block;padding:4px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
.chk input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk input:focus-visible + span{outline:2px solid var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.ch,.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.ch::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.tag.b2b{background:var(--sky-soft);color:var(--sky)} .tag.b2c{background:var(--accent-soft);color:var(--accent)} .tag.b2m{background:var(--mango-soft);color:var(--mango)}
.st{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.st.ok{background:var(--accent-soft);color:var(--accent)} .st.warn{background:var(--mango-soft);color:var(--mango)} .st.bad{background:var(--chili-soft);color:var(--chili)} .st.info{background:var(--sky-soft);color:var(--sky)}
.ex{font-size:11px;font-weight:600;color:var(--mango);background:var(--mango-soft);padding:0 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px;letter-spacing:.3px}
.kpi b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--chili)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--sunk)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar .fill.b{background:var(--sky)}
.bar .v{text-align:right;font-family:var(--mono);font-size:12px}
.vbars{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px;border-bottom:1px solid var(--line);position:relative}
.vgrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.vgrp .pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.vgrp .pair div{width:min(22px,40%);border-radius:3px 3px 0 0;background:var(--sky);min-height:1px}
.vgrp .pair div.rev{background:var(--accent)}
.vlabels{display:flex;gap:14px}
.vlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:9px 12px}
.note.warn{background:var(--mango-soft);color:var(--ink)}
.note.bad{background:var(--chili-soft);color:var(--ink)}
.note b{color:var(--ink)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);font-family:var(--body);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font-size:13px}
.card:hover{border-color:var(--accent)}
.card b{font-size:14px;line-height:1.35}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.card .due.over{color:var(--chili);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.item .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item .top .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.item p{margin:0;white-space:pre-wrap;font-size:14px}
.facts{border-left:3px solid var(--sky);padding-left:10px}
.proposal{border-left:3px solid var(--mango);padding-left:10px}
.facts small,.proposal small{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-size:12px;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .day{min-height:98px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface);min-width:0}
.cal .day:hover{background:var(--sunk)}
.cal .day.out{background:var(--bg);color:var(--muted)}
.cal .day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.cal .day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .dn{font-size:12px;font-weight:600;align-self:flex-start;font-variant-numeric:tabular-nums}
.cal .pi{font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;background:var(--sunk);border-left:3px solid var(--c,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .pi.task{border-left-style:dotted}
.cal .more{font-size:11px;color:var(--muted)}
/* launch */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:500;color:var(--muted)}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:11px;font-weight:700;color:var(--ink)}
.step.done{background:var(--accent-soft);color:var(--ink)} .step.done i{background:var(--accent);color:var(--accent-ink)}
.step.cur{outline:2px solid var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:0}
.check .ic{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
.ic.ok{background:var(--accent);color:var(--accent-ink)} .ic.no{background:var(--chili-soft);color:var(--chili)} .ic.wait{background:var(--mango-soft);color:var(--mango)}
.check .grow{flex:1;min-width:0}
.brief{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.brief summary{cursor:pointer;padding:11px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;list-style:none}
.brief summary::-webkit-details-marker{display:none}
.brief summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.brief[open] summary::before{transform:rotate(90deg)}
.brief .bbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.brief textarea{min-height:220px;font-size:13.5px;line-height:1.6}
.pthumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none;display:grid;place-items:center;color:var(--muted);font-size:11px;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.att figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);display:flex;flex-direction:column}
.att img,.att video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000;max-width:100%}
.att figcaption{font-size:11px;padding:4px 6px;display:flex;gap:4px;align-items:center;justify-content:space-between}
.att figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.statusgrid div{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:8px 10px;background:var(--sunk);border-radius:8px}
.statusgrid b{display:block;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,calc(100% - 24px));max-height:calc(100% - 32px)}
dialog.wide{width:min(980px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,15,12,.5)}
dialog .dhead{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
dialog .dbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
dialog .dfoot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.voucher{background:#fff;color:#111;padding:28px;border:1px solid var(--line);border-radius:6px;font-size:13px;max-width:800px}
.voucher h2{text-align:center;font-size:18px;color:#111}
.voucher table td,.voucher table th{border:1px solid #999;color:#111}
.voucher th{background:#eee}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;text-align:center;font-size:12px}
.sig div{border-top:1px solid #555;padding-top:6px}
.timeline{display:flex;flex-direction:column;gap:0;font-size:13px}
.timeline div{display:grid;grid-template-columns:150px 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.variant{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.variant .hook{font-family:var(--display);font-weight:600;font-size:16px}
.variant .cap{white-space:pre-wrap;margin:0}
.variant .meta{font-size:13px;color:var(--muted)}
.variant .tags{color:var(--sky);font-size:13px}
.variant .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.variant .acts input{width:auto}
#lsBody,#adsBody{display:flex;flex-direction:column;gap:16px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:13px}
.flow .node{padding:3px 10px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.flow .node.trig{background:var(--mango-soft);border-color:transparent}
.flow .node.ai{background:var(--sky-soft);border-color:transparent}
.flow .node.out{background:var(--accent-soft);border-color:transparent}
.flow .arr{color:var(--muted)}
.cnt{font-size:12px;color:var(--muted);font-weight:400}
.cnt.over{color:var(--chili)}
@media (max-width:980px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding-block:8px;padding-right:max(14px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);z-index:5;overflow-x:auto;gap:8px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand small,.navgroup > small,.railfoot .sys{display:none}
  .navgroup{flex-direction:row}
  .nv{white-space:nowrap;padding:6px 9px}
  .railfoot{margin-top:0;flex-direction:row}
  .g2,.g3,.side,.side.r,.side.l{grid-template-columns:minmax(0,1fr)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

<script src="config.js"></script>

<script>
/* Delish Creative OS — standalone runtime.
 * Provides the same `window.claude.use(name)` capabilities the app uses on claude.ai,
 * backed by Firebase (Auth, Firestore, Storage, Cloud Functions) on the company's own project.
 * Security is enforced by firestore.rules / storage.rules / functions — this file is only UX.
 */
(function () {
  "use strict";
  var CFG = window.DELISH_CONFIG || {};
  window.__STANDALONE = true;
  var LEVEL = { viewer: 1, contributor: 2, editor: 3, owner: 4 };
  var ROLE_TH = { viewer: "Viewer (ดูอย่างเดียว)", contributor: "Contributor (เพิ่ม/แก้งาน)", editor: "Editor (อนุมัติ/ตั้งค่า)", owner: "Owner" };
  var owners = (CFG.ownerEmails || []).map(function (e) { return String(e).toLowerCase(); });
  var domains = (CFG.allowedDomains || []).map(function (d) { return String(d).toLowerCase(); });

  if (!window.firebase || !CFG.firebase || !CFG.firebase.apiKey || /REPLACE/.test(CFG.firebase.apiKey)) {
    document.addEventListener("DOMContentLoaded", function () {
      gate("<h1>ยังไม่ได้ตั้งค่า Firebase</h1><p>แก้ไฟล์ <code>public/config.js</code> ใส่ค่า firebaseConfig ของโปรเจกต์บริษัท แล้ว deploy ใหม่ (ดูคู่มือ README-TH.md)</p>");
    });
    window.claude = { use: function () { return new Promise(function () {}); } };
    return;
  }

  firebase.initializeApp(CFG.firebase);
  var auth = firebase.auth(), fs = firebase.firestore();
  var fnApp = firebase.app().functions(CFG.functionsRegion || "asia-southeast1");
  var stor = CFG.storageEnabled ? firebase.storage() : null;
  if (CFG.emulators) {
    var E = CFG.emulators;
    auth.useEmulator("http://" + E.host + ":" + E.auth, { disableWarnings: true });
    fs.useEmulator(E.host, E.firestore);
    if (stor && E.storage) stor.useEmulator(E.host, E.storage);
    if (E.functions) fnApp.useEmulator(E.host, E.functions);
  }
  window.__ASSET_URL = function (id) { return /^https?:\/\//.test(id) ? id : "#"; };

  // ---------------- login gate ----------------
  var U = null, readyResolve, ready = new Promise(function (r) { readyResolve = r; });
  function gate(html) {
    var g = document.getElementById("cosGate");
    if (!g) { g = document.createElement("div"); g.id = "cosGate"; document.body.appendChild(g); }
    g.innerHTML = '<div class="gcard">' + html + "</div>"; g.hidden = false; return g;
  }
  function closeGate() { var g = document.getElementById("cosGate"); if (g) g.hidden = true; }
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  function googleProvider() {
    var p = new firebase.auth.GoogleAuthProvider();
    if (CFG.searchConsole !== false) p.addScope("https://www.googleapis.com/auth/webmasters.readonly");
    if (domains[0]) p.setCustomParameters({ hd: domains[0], prompt: "select_account" });
    return p;
  }
  function msProvider() {
    var p = new firebase.auth.OAuthProvider("microsoft.com");
    p.setCustomParameters(Object.assign({ prompt: "select_account" }, CFG.microsoftTenant ? { tenant: CFG.microsoftTenant } : {}));
    return p;
  }
  function keepGoogleToken(res) {
    var tok = res && res.credential && res.credential.accessToken;
    if (tok && res.credential.providerId === "google.com") {
      try { sessionStorage.setItem("cos.gtok", JSON.stringify({ t: tok, exp: Date.now() + 55 * 60 * 1000 })); } catch (e) {}
    }
  }
  function signIn(kind) {
    var p = kind === "ms" ? msProvider() : googleProvider();
    return auth.signInWithPopup(p).then(keepGoogleToken).catch(function (e) {
      if (e && e.code === "auth/popup-blocked") return auth.signInWithRedirect(p);
      showLogin("เข้าสู่ระบบไม่สำเร็จ: " + (e && e.message ? e.message : e));
    });
  }
  window.__cosSignIn = signIn;
  window.__cosSignOut = function () { try { sessionStorage.removeItem("cos.gtok"); } catch (e) {} auth.signOut().then(function () { location.reload(); }); };
  window.__cosRelinkGoogle = function () {
    var u = auth.currentUser; if (!u) return;
    u.reauthenticateWithPopup(googleProvider()).then(function (r) { keepGoogleToken(r); toastShim("เชื่อม Google ใหม่แล้ว"); })
      .catch(function (e) { toastShim("เชื่อม Google ไม่สำเร็จ: " + (e.message || e.code)); });
  };
  function showLogin(err) {
    var methods = CFG.signInMethods || ["google", "microsoft"];
    gate('<div class="glogo">D</div><h1>' + esc(CFG.appName || "Delish Creative OS") + "</h1><p>เข้าสู่ระบบด้วยบัญชีบริษัท" + (domains.length ? " (@" + domains.map(esc).join(", @") + ")" : "") + "</p>" +
      (err ? '<p class="gerr">' + esc(err) + "</p>" : "") +
      (methods.indexOf("google") >= 0 ? '<button class="gbtn" onclick="__cosSignIn(\'google\')">เข้าสู่ระบบด้วย Google</button>' : "") +
      (methods.indexOf("microsoft") >= 0 ? '<button class="gbtn" onclick="__cosSignIn(\'ms\')">เข้าสู่ระบบด้วย Microsoft</button>' : "") +
      '<p class="gsm">ใช้ได้เฉพาะสมาชิกที่ผู้ดูแลเพิ่มสิทธิ์แล้ว</p>');
  }
  function toastShim(m) { var t = document.getElementById("toast"); if (t) { t.textContent = m; t.hidden = false; setTimeout(function () { t.hidden = true; }, 3500); } else alert(m); }

  auth.getRedirectResult().then(keepGoogleToken).catch(function () {});
  auth.onAuthStateChanged(function (fbUser) {
    if (U && (!fbUser || fbUser.uid !== U.uid)) { location.reload(); return; }
    if (!fbUser) { showLogin(); return; }
    var email = String(fbUser.email || "").toLowerCase();
    var dom = email.split("@")[1] || "";
    if (domains.length && domains.indexOf(dom) < 0 && owners.indexOf(email) < 0) {
      gate("<h1>บัญชีนี้ใช้ไม่ได้</h1><p>" + esc(email) + " ไม่ใช่อีเมลของบริษัท</p><button class=\"gbtn\" onclick=\"__cosSignOut()\">ออกจากระบบ</button>");
      return;
    }
    gate("<p>กำลังตรวจสิทธิ์…</p>");
    var isOwner = owners.indexOf(email) >= 0;
    (isOwner ? Promise.resolve(null) : fs.doc("members/" + email).get().then(function (s) { return s.exists ? s.data() : null; }).catch(function () { return null; }))
      .then(function (m) {
        var role = isOwner ? "owner" : (m && LEVEL[m.role] ? m.role : null);
        if (!role) {
          gate("<h1>รอผู้ดูแลเพิ่มสิทธิ์</h1><p>บัญชี <b>" + esc(email) + "</b> ยังไม่มีสิทธิ์ใช้งาน แจ้งผู้ดูแลให้เพิ่มในเมนู “จัดการสิทธิ์”</p><button class=\"gbtn\" onclick=\"location.reload()\">ตรวจอีกครั้ง</button><button class=\"gbtn ghost\" onclick=\"__cosSignOut()\">ออกจากระบบ</button>");
          return;
        }
        U = { uid: fbUser.uid, email: email, name: fbUser.displayName || email.split("@")[0], photo: fbUser.photoURL || "", role: role, lvl: LEVEL[role],
          provider: (fbUser.providerData[0] || {}).providerId || "" };
        fs.doc("profiles/" + U.uid).set({ name: U.name, email: email, photo: U.photo, role: role, lastSeen: new Date().toISOString() }, { merge: true }).catch(function () {});
        closeGate(); addUserMenu(); readyResolve(U);
      });
  });

  // ---------------- members (roles) admin ----------------
  function addUserMenu() {
    var foot = document.querySelector(".railfoot"); if (!foot || document.getElementById("cosMenu")) return;
    var d = document.createElement("div"); d.id = "cosMenu"; d.className = "cosmenu";
    d.innerHTML = (U.lvl >= 3 ? '<button class="btn sm" type="button" id="cosMembers">จัดการสิทธิ์</button>' : "") +
      (U.provider === "google.com" ? '<button class="btn sm" type="button" onclick="__cosRelinkGoogle()" title="ต่ออายุสิทธิ์ Search Console">เชื่อม Google ใหม่</button>' : "") +
      '<button class="btn sm" type="button" onclick="__cosSignOut()">ออกจากระบบ</button>';
    foot.appendChild(d);
    var b = document.getElementById("cosMembers"); if (b) b.onclick = openMembers;
  }
  function openMembers() {
    var dlg = document.getElementById("dlg"); if (!dlg) return;
    document.getElementById("dlgTitle").textContent = "จัดการสิทธิ์ผู้ใช้";
    var roles = U.lvl >= 4 ? ["viewer", "contributor", "editor"] : ["viewer", "contributor"];
    document.getElementById("dlgBody").innerHTML =
      '<div class="note">เพิ่มอีเมลบริษัทของสมาชิก ระบบตรวจสิทธิ์ที่ฐานข้อมูลทุกครั้ง · Owner: ' + owners.map(esc).join(", ") + (U.lvl < 4 ? " · Editor เพิ่มได้ถึงระดับ Contributor" : "") + "</div>" +
      '<form class="row" id="memForm"><input type="text" id="memEmail" placeholder="name@' + esc(domains[0] || "company.com") + '" style="flex:2 1 220px"><select id="memRole" style="flex:1 1 160px">' +
      roles.map(function (r) { return '<option value="' + r + '">' + ROLE_TH[r] + "</option>"; }).join("") + '</select><button class="btn primary" type="submit">เพิ่ม/อัปเดต</button></form><div id="memList" class="list"><div class="cnt">กำลังโหลด…</div></div>';
    document.getElementById("dlgFoot").innerHTML = '<span class="spacer"></span><button class="btn" type="button" onclick="document.getElementById(\'dlg\').close()">ปิด</button>';
    if (!dlg.open) dlg.showModal();
    var unsub = fs.collection("members").onSnapshot(function (qs) {
      var rows = qs.docs.map(function (s) { return Object.assign({ email: s.id }, s.data()); }).sort(function (a, b) { return a.email.localeCompare(b.email); });
      var el = document.getElementById("memList"); if (!el) return;
      el.innerHTML = rows.length ? rows.map(function (m) {
        var can = U.lvl >= 4 || LEVEL[m.role] < 3;
        return '<div class="item"><div class="top"><b>' + esc(m.email) + '</b><span class="st">' + esc(ROLE_TH[m.role] || m.role) + '</span><span class="r">' + (can ? '<button class="btn ghost sm" type="button" data-rm="' + esc(m.email) + '">ลบสิทธิ์</button>' : "") + "</span></div></div>";
      }).join("") : '<div class="empty">ยังไม่มีสมาชิก</div>';
      el.querySelectorAll("[data-rm]").forEach(function (btn) {
        btn.onclick = function () { fs.doc("members/" + btn.dataset.rm).delete().then(function () { toastShim("ลบสิทธิ์แล้ว"); }).catch(function (e) { toastShim("ลบไม่สำเร็จ: " + e.code); }); };
      });
    }, function (e) { var el = document.getElementById("memList"); if (el) el.innerHTML = '<div class="note bad">โหลดไม่ได้: ' + esc(e.code) + "</div>"; });
    dlg.addEventListener("close", function () { unsub(); }, { once: true });
    document.getElementById("memForm").onsubmit = function (ev) {
      ev.preventDefault();
      var em = document.getElementById("memEmail").value.trim().toLowerCase(), role = document.getElementById("memRole").value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toastShim("อีเมลไม่ถูกต้อง"); return; }
      if (domains.length && domains.indexOf(em.split("@")[1]) < 0) { toastShim("ต้องเป็นอีเมลโดเมน " + domains.join(", ")); return; }
      fs.doc("members/" + em).set({ role: role, addedBy: U.email, addedAt: new Date().toISOString() })
        .then(function () { document.getElementById("memEmail").value = ""; toastShim("บันทึกสิทธิ์ " + em); })
        .catch(function (e) { toastShim("บันทึกไม่สำเร็จ: " + e.code); });
    };
  }

  // ---------------- db (Firestore) ----------------
  var FS_CODE = { "permission-denied": "permission_denied", "not-found": "not_found", "resource-exhausted": "resource_exhausted", "invalid-argument": "invalid_argument", unavailable: "unavailable", "failed-precondition": "invalid_argument" };
  function E(e) { return { code: FS_CODE[e && e.code] || (e && e.code) || "error", message: (e && e.message) || String(e) }; }
  function rej(e) { throw E(e); }
  function snapDoc(s) { return { id: s.id, exists: !!s.exists, data: function () { return s.exists ? s.data() : undefined; }, metadata: { fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites } }; }
  function snapQ(x) { return { docs: x.docs.map(snapDoc), size: x.size, empty: x.empty, docChanges: function () { return x.docChanges().map(function (c) { return { type: c.type, doc: snapDoc(c.doc), oldIndex: c.oldIndex, newIndex: c.newIndex }; }); } }; }
  function docW(ref) {
    return { id: ref.id, path: ref.path,
      get: function () { return ref.get().then(snapDoc, rej); },
      set: function (d) { return ref.set(d).catch(rej); },
      update: function (d) { return ref.update(d).catch(rej); },
      "delete": function () { return ref.delete().catch(rej); },
      onSnapshot: function (n, err) { return ref.onSnapshot(function (s) { n(snapDoc(s)); }, function (e) { if (err) err(E(e)); }); },
      collection: function (p) { return colW(ref.collection(p)); } };
  }
  function qW(q) {
    return { where: function (f, o, v) { return qW(q.where(f, o, v)); }, orderBy: function (f, d) { return qW(q.orderBy(f, d)); }, limit: function (n) { return qW(q.limit(n)); },
      get: function () { return q.get().then(snapQ, rej); },
      onSnapshot: function (n, err) { return q.onSnapshot(function (x) { n(snapQ(x)); }, function (e) { if (err) err(E(e)); }); } };
  }
  function colW(ref) { var w = qW(ref); w.doc = function (id) { return docW(id ? ref.doc(id) : ref.doc()); }; w.add = function (d) { return ref.add(d).then(docW, rej); }; return w; }
  var db = { collection: function (p) { return colW(fs.collection(p)); }, doc: function (p) { return docW(fs.doc(p)); } };

  // ---------------- user ----------------
  var profCache = {};
  var user = {
    me: function () { return Promise.resolve({ id: U.uid, name: U.name, avatarUrl: U.photo, color: "", email: U.email, isOwner: U.role === "owner", canEdit: U.lvl >= 3 }); },
    id: function () { return Promise.resolve(U.uid); }, name: function () { return Promise.resolve(U.name); }, email: function () { return Promise.resolve(U.email); },
    avatarUrl: function () { return Promise.resolve(U.photo || null); },
    isOwner: function () { return Promise.resolve(U.role === "owner"); }, canEdit: function () { return Promise.resolve(U.lvl >= 3); },
    can: function (c) { return Promise.resolve(c === "data.write" ? U.lvl >= 2 : null); },
    profiles: function (ids) {
      ids = [].concat(ids).filter(Boolean);
      return Promise.all(ids.map(function (id) {
        if (profCache[id]) return profCache[id];
        return fs.doc("profiles/" + id).get().then(function (s) { var d = s.exists ? s.data() : {}; profCache[id] = { id: id, name: d.name || "", avatarUrl: d.photo || "", color: "", email: d.email || null, isMe: id === U.uid, guest: false }; return profCache[id]; }).catch(function () { return { id: id, name: "", isMe: false, guest: false }; });
      })).then(function (arr) { var o = {}; arr.forEach(function (p) { o[p.id] = p; }); return o; });
    },
    search: function () { return Promise.resolve([]); }
  };

  // ---------------- sample (AI via Cloud Function) ----------------
  var sample = null;
  if (CFG.aiEnabled) {
    var call = fnApp.httpsCallable("ai", { timeout: 300000 });
    var FN = { unauthenticated: "not_granted", "permission-denied": "not_granted", "failed-precondition": "not_granted", "resource-exhausted": "rate_limited", "invalid-argument": "bad_request", "deadline-exceeded": "timeout" };
    sample = function (input, opts) {
      opts = opts || {};
      if (opts.signal && opts.signal.aborted) return Promise.reject({ code: "cancelled", message: "cancelled" });
      var p = call({ input: input, tier: opts.modelTier || "default" }).then(function (r) {
        var text = (r.data && r.data.text) || "";
        if (opts.onText) try { opts.onText({ text: text, delta: text }); } catch (e) {}
        return { text: text, truncated: !!(r.data && r.data.truncated) };
      }, function (e) { var c = String(e && e.code || "").replace(/^functions\//, ""); throw { code: FN[c] || "upstream_error", message: e && e.message }; });
      if (!opts.signal) return p;
      return new Promise(function (res, rejx) { opts.signal.addEventListener("abort", function () { rejx({ code: "cancelled", message: "cancelled" }); }, { once: true }); p.then(res, rejx); });
    };
    sample.json = function (input, opts) {
      return sample(input, opts).then(function (r) {
        var t = r.text, m = t.match(/```(?:json)?\s*([\s\S]*?)```/); var s = (m ? m[1] : t).trim();
        var i = s.search(/[\[{]/); if (i > 0) s = s.slice(i);
        var j = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]")); if (j >= 0) s = s.slice(0, j + 1);
        try { return JSON.parse(s); } catch (e) { throw { code: "invalid_json", message: "AI ตอบกลับไม่ใช่ JSON", text: r.text }; }
      });
    };
    sample.limits = function () { return Promise.resolve({ images: false }); };
  }

  // ---------------- assets (Cloud Storage) ----------------
  function assetsFor() {
    if (!stor || U.lvl < 2) return null;
    return { upload: function (blob) {
      var name = String(blob.name || "file").replace(/[^\w.\-]/g, "_").slice(-80);
      var ref = stor.ref("assets/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + name);
      return ref.put(blob, { contentType: blob.type || "application/octet-stream" }).then(function () { return ref.getDownloadURL(); })
        .then(function (url) { return { id: url, url: url, sizeBytes: blob.size, contentType: blob.type }; }, function (e) { throw { code: e.code || "upload_failed", message: e.message }; });
    } };
  }

  // ---------------- downloads ----------------
  var downloads = { save: function (req) {
    var blob = req.data instanceof Blob ? req.data : new Blob([req.data], { type: /\.csv$/i.test(req.filename) ? "text/csv;charset=utf-8" : /\.json$/i.test(req.filename) ? "application/json" : /\.html?$/i.test(req.filename) ? "text/html;charset=utf-8" : "application/octet-stream" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = req.filename; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return Promise.resolve({ status: "saved" });
  } };

  // ---------------- mcp: Search Console directly with the user's Google token ----------------
  var GSC = "https://www.googleapis.com/webmasters/v3";
  var mcp = { callTool: function (server, tool, input) {
    if (server !== "Delish Search Console") return Promise.reject({ code: "server_not_connected", server: server, message: "unknown server" });
    if (U.provider !== "google.com") return Promise.reject({ code: "server_not_connected", server: server, message: "not a Google account" });
    var tok = null; try { var o = JSON.parse(sessionStorage.getItem("cos.gtok") || "null"); if (o && o.exp > Date.now()) tok = o.t; } catch (e) {}
    if (!tok) return Promise.reject({ code: "needs_reauth", server: server, message: "Google token missing or expired" });
    var req;
    if (tool === "gsc_list_sites") req = fetch(GSC + "/sites", { headers: { Authorization: "Bearer " + tok } });
    else if (tool === "gsc_search_analytics") {
      var a = input || {};
      req = fetch(GSC + "/sites/" + encodeURIComponent(a.siteUrl) + "/searchAnalytics/query", { method: "POST", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" },
        body: JSON.stringify({ startDate: a.startDate, endDate: a.endDate, dimensions: a.dimensions, rowLimit: a.rowLimit || 1000, startRow: a.startRow || 0, type: a.type || "web", dataState: a.dataState || "final" }) });
    } else return Promise.reject({ code: "not_in_manifest", message: tool });
    return req.then(function (r) { return r.text().then(function (t) {
      var j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}

        ? { sites: (j.siteEntry || []).map(function (s) { return { siteUrl: s.siteUrl, permissionLevel: s.permissionLevel }; }) }
        : { siteUrl: input.siteUrl, startDate: input.startDate, endDate: input.endDate, dimensions: input.dimensions, fetchedAt: new Date().toISOString(),

      return { content: [], payload: payload };
    }); }, function (e) { if (e && e.code) throw e; throw { code: "server_unavailable", retryable: true, message: String(e) }; });
  } };

  // ---------------- window.claude ----------------
  window.claude = { use: function (name) {
    return ready.then(function () {
      switch (name) {
        case "db": return db; case "user": return user; case "sample": return sample;

        case "permissions": return { state: function () { return Promise.resolve("granted"); }, request: function () { return Promise.resolve({}); } };

      }
    });

})();

function need(){if(!db)throw{code:"no_db",message:"ยังเชื่อมต่อฐานข้อมูลไม่ได้"}}

function clean(o){if(Array.isArray(o))return o.map(clean);if(o&&typeof o==="object"){const r={};for(const k in o)if(o[k]!==undefined&&k!=="id")r[k]=clean(o[k]);return r}return o}
async function dbAdd(col,data){need();return db.collection(col).add(clean(stampNew(data)))}

async function safeSave(col,id,data,baseUpdatedAt){need();const ref=db.collection(col).doc(id);const cur=await ref.get();

// ================= rendering & routing =================

// ================= CSV =================
function parseCSV(text){text=text.replace(/^﻿/,"");const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===","||c==="\t"&&!text.includes(",")){row.push(cur);cur=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()!==""))rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()!==""))rows.push(row);return rows}
function toCSV(rows){return rows.map(r=>r.map(v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n")}
function mapHeaders(hdr,aliases){const h=hdr.map(x=>x.trim().toLowerCase());const m={};for(const[k,al]of Object.entries(aliases)){const i=h.findIndex(x=>al.includes(x));if(i>=0)m[k]=i}return m}
function normDate(s){s=(s||"").trim();if(!s)return"";let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m){let y=+m[3];if(y>2400)y-=543;return y+"-"+pad(m[2])+"-"+pad(m[1])}return""}
function normMonth(s){s=(s||"").trim();let m=s.match(/^(\d{4})-(\d{1,2})/);if(m)return m[1]+"-"+pad(m[2]);m=s.match(/^(\d{1,2})\/(\d{4})$/);if(m){let y=+m[2];if(y>2400)y-=543;return y+"-"+pad(m[1])}return""}

// ================= Thai baht text =================
function bahtText(n){if(n==null||!Number.isFinite(n))return"";const neg=n<0;n=Math.round(Math.abs(n)*100)/100;const b=Math.floor(n),st=Math.round((n-b)*100);
  const D=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"],P=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  const six=x=>{const s=String(x),L=s.length;let o="";for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
    if(p===0&&d===1&&L>1)o+="เอ็ด";else if(p===1&&d===2)o+="ยี่";else if(p===1&&d===1)o+="";else o+=D[d];o+=P[p]}return o};
  const full=x=>{if(x===0)return"ศูนย์";const parts=[];while(x>0){parts.unshift(x%1e6);x=Math.floor(x/1e6)}
    return parts.map((p,i)=>{let s=p?six(p):"";if(i>0&&p===1)s="เอ็ด";return s+(i<parts.length-1?"ล้าน":"")}).join("")};
  let out=(b?full(b)+"บาท":"")+(st?full(st)+"สตางค์":(b?"ถ้วน":"ศูนย์บาทถ้วน"));return(neg?"ลบ":"")+out}

// ================= cross-month split =================
/** Split an amount across calendar months by the number of running days in each month (start and end inclusive). */
function splitByMonth(amount,start,end){if(amount==null||!start||!end||end<start)return[];const out={};let d=new Date(start+"T00:00");const e=new Date(end+"T00:00");let total=0;
  while(d<=e){const m=ymd(d).slice(0,7);out[m]=(out[m]||0)+1;total++;d.setDate(d.getDate()+1)}
  const keys=Object.keys(out);let acc=0;return keys.map((m,i)=>{let v=i===keys.length-1?Math.round((amount-acc)*100)/100:Math.round(amount*out[m]/total*100)/100;acc+=v;return{month:m,days:out[m],amount:v}})}

function apprBadge(t){const a=approvalOf(t);if(!a)return t.status==="review"?`<span class="st warn">รอตรวจ</span>`:"";

  else{const drafts=S.posts.filter(p=>!p.date);side=`<h2>ดราฟต์ที่ยังไม่กำหนดวัน (${drafts.length})</h2><div class="list">${drafts.map(postCard).join("")||`<div class="empty">คลิกวันที่ในปฏิทินเพื่อดูรายละเอียด</div>`}</div>`}
  $("#v-cal").innerHTML=`<div class="vhead"><div><h1>ปฏิทินคอนเทนต์และแคมเปญ</h1><p>โพสต์ที่วางแผนไว้ (แถบทึบ) และกำหนดส่งงานในบอร์ด (แถบประ) อยู่ในปฏิทินเดียวกัน</p></div>
    <div class="row"><button class="btn" data-act="calNav" data-n="-1" aria-label="เดือนก่อน">‹</button><b style="font-family:var(--display);min-width:140px;text-align:center">${TH_M[m.getMonth()]} ${m.getFullYear()+543}</b><button class="btn" data-act="calNav" data-n="1" aria-label="เดือนถัดไป">›</button><button class="btn" data-act="calNav" data-n="0">วันนี้</button><button class="btn primary" data-act="newPost" data-d="${s||today()}">＋ โพสต์</button></div></div>

function csvImportDlg({title,aliases,need,hint,build,col,exists,cols}){let parsed=null;
  openDlg({title,wide:true,body:`<div class="note">${hint}<br>แถวที่ซ้ำกับข้อมูลเดิม (คีย์เดียวกัน) จะถูกข้ามโดยค่าเริ่มต้น ไม่ลบหรือเขียนทับข้อมูลเดิม</div>
    <div class="row"><button class="btn" type="button" id="csvPick">เลือกไฟล์ CSV</button><span class="cnt" id="csvName">หรือวางข้อมูลด้านล่าง</span></div>${area("ข้อมูล CSV","csvText","",6)}
    <label class="chk"><input type="checkbox" id="csvUpd"><span>อัปเดตแถวที่ซ้ำด้วยค่าจากไฟล์</span></label><div id="csvPrev"></div>`,
  onOpen:()=>{let fname="วางข้อความ";const prev=()=>{const rows=parseCSV($("#csvText").value);if(rows.length<2){$("#csvPrev").innerHTML="";parsed=null;return}
      const m=mapHeaders(rows[0],aliases);const miss=need.filter(k=>m[k]==null);if(miss.length){$("#csvPrev").innerHTML=`<div class="note bad">ไม่พบคอลัมน์: ${miss.join(", ")}</div>`;parsed=null;return}
      const out=[],seen=new Set();let dupIn=0,bad=0;for(const r of rows.slice(1)){const g=k=>m[k]!=null?(r[m[k]]||"").trim():"";const b=build(g,fname);if(!b){bad++;continue}if(seen.has(b.id)){dupIn++;continue}seen.add(b.id);out.push(b)}
      const dupOld=out.filter(b=>exists(b.id)).length;parsed=out;
      $("#csvPrev").innerHTML=`<div class="note">พบ ${out.length} แถว · ใหม่ ${out.length-dupOld} · ซ้ำกับข้อมูลเดิม ${dupOld}${dupIn?` · ซ้ำในไฟล์ ${dupIn} (ใช้แถวแรก)`:""}${bad?` · ข้ามแถวไม่สมบูรณ์ ${bad}`:""}</div>
        <div class="tablewrap" style="max-height:240px;overflow:auto"><table><thead><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${out.slice(0,50).map(b=>`<tr><td>${exists(b.id)?`<span class="st warn">ซ้ำ</span>`:`<span class="st ok">ใหม่</span>`}</td>${cols.map(c=>`<td class="num">${esc(b.data[c]??"–")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
    $("#csvText").oninput=prev;$("#csvPick").onclick=async()=>{const f=await pickFile(".csv,text/csv,text/plain");if(!f)return;fname=f.name;$("#csvName").textContent=f.name;$("#csvText").value=await f.text();prev()}},
  foot:["|",{label:"ยกเลิก"},{label:"นำเข้า",cls:"primary",act:async()=>{if(!parsed?.length){toast("ยังไม่มีข้อมูลที่นำเข้าได้");return false}const upd=$("#csvUpd").checked;let add=0,up=0,skip=0;
    const writes=parsed.slice();for(const b of writes){const ex=exists(b.id);try{if(ex){if(!upd){skip++;continue}await dbUpd(col,b.id,b.data);up++}else{await dbSetNew(col,b.id,b.data);add++}}catch(e){toast(dbErr(e));break}}
    toast(`นำเข้าใหม่ ${add} · อัปเดต ${up} · ข้าม ${skip}`)}}]})}

const SENT={pos:["เชียร์","ok"],neu:["กลาง (ถาม/ให้ข้อมูล)",""],negsup:["ติแต่เอาใจช่วย","warn"],neg:["ติ / ชี้ปัญหา","bad"]};
const isNeg=s=>s==="neg"||s==="negsup";
/** Net Sentiment (skill): (เชียร์ − ติ − ติแต่เอาใจช่วย) ÷ (เชียร์ + ติ + ติแต่เอาใจช่วย) × 100, ไม่นับกลาง */
function netSent(ms){let p=0,n=0;for(const m of ms){if(m.sentiment==="pos")p++;else if(isNeg(m.sentiment))n++}return p+n?(p-n)/(p+n)*100:null}
const live=ms=>ms.filter(m=>!m.excluded);
const INTENT={question:"คำถาม",complaint:"ร้องเรียน",praise:"ชื่นชม",purchase:"สนใจซื้อ",lead:"ลีดธุรกิจ (B2B)",other:"อื่นๆ"};
const MST={new:["ใหม่","info"],assigned:["มอบหมายแล้ว","warn"],replied:["ตอบแล้ว","ok"],closed:["ปิดเรื่อง",""],ignored:["ไม่ต้องตอบ",""]};
const QTYPE={brand:"แบรนด์เรา",product:"สินค้า",competitor:"คู่แข่ง",industry:"อุตสาหกรรม/เทรนด์"};
const LPLAT={facebook:"Facebook",instagram:"Instagram",tiktok:"TikTok",line:"LINE OA",youtube:"YouTube",x:"X",pantip:"Pantip",shopee:"Shopee/Lazada (รีวิว)",google:"Google Maps/รีวิว",news:"ข่าว/เว็บไซต์",other:"อื่นๆ"};
const OPEN_M=new Set(["new","assigned"]);
const kwList=s=>String(s||"").split(/[,\n]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
/** Which listening queries a text matches: any keyword present and no excluded word present. */
function matchQueries(text,queries){const t=String(text||"").toLowerCase();return queries.filter(q=>q.active!==false&&kwList(q.keywords).some(k=>t.includes(k))&&!kwList(q.exclude).some(k=>t.includes(k))).map(q=>q.id)}
const mentionId=d=>"M-"+hash(d.url?String(d.url).trim().toLowerCase()+"|"+String(d.text||"").slice(0,80):[d.platform,d.author,d.postedAt,String(d.text||"").slice(0,200)].join("|"));
const mDate=m=>(m.postedAt||m.createdAt||"").slice(0,10);
function lsStats(ms){const t=today();const byDay={};for(let i=29;i>=0;i--)byDay[addDays(t,-i)]={pos:0,neu:0,negsup:0,neg:0,none:0};
  ms=live(ms);for(const m of ms){const d=mDate(m);if(byDay[d])byDay[d][SENT[m.sentiment]?m.sentiment:"none"]++}
  const negToday=byDay[t].neg+byDay[t].negsup;const prev=[1,2,3,4,5,6,7].map(i=>{const x=byDay[addDays(t,-i)];return x?x.neg+x.negsup:0});const avg=prev.reduce((a,b)=>a+b,0)/7;
  const late=ms.filter(m=>OPEN_M.has(m.status||"new")&&["complaint","question","lead"].includes(m.intent)&&m.postedAt&&(Date.now()-new Date(m.postedAt))>864e5);
  const rt=ms.filter(m=>m.repliedAt&&m.postedAt).map(m=>(new Date(m.repliedAt)-new Date(m.postedAt))/60000).filter(x=>x>=0).sort((a,b)=>a-b);
  const med=rt.length?rt[Math.floor((rt.length-1)/2)]:null;
  return{byDay,negToday,avg,spike:negToday>=3&&negToday>2*Math.max(avg,0.5),late,med,rtN:rt.length}}

function normSrcT(s){s=(s||"").toLowerCase();if(/brand|แบรนด์/.test(s))return"brand";if(/news|ข่าว|สื่อ/.test(s))return"news";if(/review|รีวิว|influ/.test(s))return"review";if(/shopee|lazada|market|google|map/.test(s))return"market";return"user"}

function autoClean(text){const core=String(text||"").replace(/@\S+/g,"").replace(/[\p{Extended_Pictographic}\p{Emoji_Component}\s\p{P}\p{S}]/gu,"");return core.length<2?{excluded:true,excludeReason:"tag"}:{}}

/** "36% (42 จาก 118 ข้อความ)"; small bases per skill: <20 → x จาก y first; <10 → counts only */
function pctS(x,y,unit="ข้อความ"){if(!y)return"–";const p=x/y*100;const ps=p<10?p.toFixed(1):Math.round(p).toString();
  if(y<10)return`${x} จาก ${y}`;if(y<20)return`${x} จาก ${y} (${ps}%)`;return`${ps}% (${x} จาก ${y} ${unit})`}

function lsDataset(){const f=S.ui.lr||(S.ui.lr={from:addDays(today(),-29),to:today(),q:"",question:"คนพูดถึง Delish Foods ว่าอย่างไร"});
  const all=S.mentions.filter(m=>!f.q||(m.queries||[]).includes(f.q));const reasons=Object.fromEntries(Object.keys(EXR).map(k=>[k,0]));const seen=new Set();const used=[];let inRange=0;
  for(const m of all.slice().sort((a,b)=>(a.postedAt||a.createdAt||"").localeCompare(b.postedAt||b.createdAt||""))){const d=mDate(m);
    if(!d||d<f.from||d>f.to){continue}inRange++;
    let r=m.excluded?(m.excludeReason||"offtopic"):null;if(!r&&(m.authorRole==="admin"||m.authorRole==="op"))r="admin";
    const key=String(m.text||"").replace(/\s+/g," ").trim().toLowerCase();if(!r&&seen.has(key))r="dup";seen.add(key);
    if(r){reasons[r]=(reasons[r]||0)+1;continue}used.push(m)}
  const coded=used.filter(m=>SENT[m.sentiment]);return{f,collected:inRange,reasons,used,coded,uncoded:used.length-coded.length}}
function topicStats(coded){const M=coded.length;const map={};for(const m of coded)for(const t of(m.topics?.length?m.topics:["(ไม่เข้าหมวด)"])){(map[t]=map[t]||[]).push(m)}
  return Object.entries(map).map(([t,ms])=>{const c=k=>ms.filter(m=>m.sentiment===k).length;const n=ms.length;const neg=c("neg")+c("negsup");const sov=n/M,negRate=n?neg/n:0;
    return{topic:t,n,sov,pos:c("pos"),neu:c("neu"),negsup:c("negsup"),neg:c("neg"),negRate,net:netSent(ms),qShare:n?c("neu")/n:0,urgency:sov*negRate*100,ms}}).sort((a,b)=>b.n-a.n)}
function quotesFor(ms,pref){const pick=ms.filter(m=>!pref||pref.includes(m.sentiment)).map(m=>anon(m.text).replace(/\s+/g," ").trim()).filter(t=>t.length>=6).sort((a,b)=>Math.abs(a.length-60)-Math.abs(b.length-60));return pick.slice(0,2).map(t=>t.length>110?t.slice(0,108)+"…":t)}

  needs_reauth:`สิทธิ์ Google หมดอายุ — เชื่อมต่อ “${GSC_SERVER}” ใหม่ที่ claude.ai Settings → Connectors`,
  not_in_manifest:"คุณปิดหรือไม่อนุญาต Connector นี้สำหรับหน้านี้ เปิดได้จากเมนู Permissions ของหน้า",
  approval_required:"ต้องกดอนุญาตให้หน้านี้ใช้ Connector ก่อน (กดปุ่มอีกครั้งแล้วเลือก Allow)",
  blocked_by_policy:"นโยบายองค์กรบล็อก Connector นี้สำหรับบัญชีของคุณ ติดต่อผู้ดูแล claude.ai",
  selection_required:`มี Connector ชื่อ “${GSC_SERVER}” มากกว่า 1 ตัว เลือกตัวที่ใช้ในหน้าต่างที่ claude.ai แสดง`,
  server_unavailable:"เซิร์ฟเวอร์ Connector ไม่ตอบ (ชั่วคราว) ลองใหม่อีกครั้งในไม่กี่นาที",
  not_granted:"มุมมองนี้ใช้ Connector ไม่ได้ (ต้องเปิดใน claude.ai ขณะล็อกอิน)",capability_disabled:"มุมมองนี้ใช้ Connector ไม่ได้ (ต้องเปิดใน claude.ai ขณะล็อกอิน)"};
const gscErr=e=>HOSTED&&GSC_ERR_HOSTED[e?.code]?GSC_ERR_HOSTED[e.code]:e?.code==="tool_error"?"Search Console ตอบกลับข้อผิดพลาด: "+String(e.message||"").slice(0,300):(GSC_ERR[e?.code]||`เชื่อมต่อไม่สำเร็จ (${e?.code||"error"})`);
function gscState(){const g=S.integ?.gsc;if(!g?.lastOk)return{s:"off",t:"ยังไม่เชื่อมต่อ",d:"ยังไม่เคยทดสอบสำเร็จ ข้อมูล SEO มาจากการกรอกหรือ CSV"};
  const age=(Date.now()-new Date(g.lastOk))/864e5;return{s:age>30?"warn":"on",t:"เชื่อมผ่าน Connector แล้ว",d:`ทดสอบสำเร็จล่าสุด ${thDT(g.lastOk)} โดย ${who(g.lastOkBy)} · Property: ${g.siteUrl||"ยังไม่เลือก"}${g.lastSync?` · ดึงข้อมูลล่าสุด ${thDT(g.lastSync)} (${thMonth(g.lastSyncMonth)})`:""}${age>30?" · ทดสอบเกิน 30 วันแล้ว ควรทดสอบใหม่":""}`}}
function gscPanel(){const st=gscState(),g=S.integ?.gsc||{};const loc=S.ui.gscLocal;
  return`<div class="panel" id="gscPanel"><div class="ph"><h2>Google Search Console API</h2><span class="st ${st.s==="on"?"ok":st.s==="warn"?"warn":"bad"}">${st.t}</span></div>

  <div class="row" style="margin-top:10px"><button class="btn" data-act="gscTest" ${mcp?"":"disabled title='มุมมองนี้ใช้ Connector ไม่ได้'"}>ทดสอบการเชื่อมต่อ</button><button class="btn primary" data-act="gscSync" ${mcp&&g.siteUrl?"":"disabled"}>ดึงข้อมูลจาก Search Console</button><a href="#" data-act="gscHelp" class="cnt">วิธีติดตั้งสำหรับ IT</a></div>

ACT.gscTest=async el=>{if(!mcp)return;el.disabled=true;S.ui.gscLocal={ok:true,msg:"กำลังทดสอบ…"};forceRender();
  try{const r=await mcp.callTool(GSC_SERVER,"gsc_list_sites",{});const sites=(r?.payload?.sites||[]).filter(s=>s&&s.siteUrl);
    if(!sites.length){S.ui.gscLocal={ok:false,msg:"เชื่อมต่อได้ แต่บัญชี Google ที่ใช้ไม่มีสิทธิ์ใน Property ใดเลย ให้เจ้าของ Search Console เพิ่มบัญชีนี้เป็นผู้ใช้"};}
    else{S.ui.gscLocal={ok:true,msg:`เชื่อมต่อสำเร็จ · พบ ${sites.length} Property`,sites};
      if(S.canEdit){const cur=S.integ?.gsc||{};await db.doc("settings/integrations").set(clean({...S.integ,gsc:{...cur,lastOk:nowISO(),lastOkBy:S.me?.id||null,siteUrl:cur.siteUrl&&sites.some(s=>s.siteUrl===cur.siteUrl)?cur.siteUrl:(sites[0].siteUrl)}}))}}}
  catch(e){S.ui.gscLocal={ok:false,msg:gscErr(e)}}finally{forceRender()}};
ACT.gscSave=async()=>{try{const cur=S.integ?.gsc||{};await db.doc("settings/integrations").set(clean({...S.integ,gsc:{...cur,siteUrl:V("gscSite")}}));toast("บันทึก Property แล้ว")}catch(e){toast(dbErr(e))}};
function gscMonths(){const out=[];const d=new Date();d.setDate(1);for(let i=0;i<16;i++){out.push(ymd(d).slice(0,7));d.setMonth(d.getMonth()-1)}return out}
function monthRange(m){const[y,mo]=m.split("-").map(Number);const last=new Date(y,mo,0).getDate();const end=m+"-"+pad(last);const t=today();return{start:m+"-01",end:end>t?addDays(t,-1):end,partial:end>=t}}
ACT.gscSync=()=>{const g=S.integ?.gsc;if(!g?.siteUrl)return;const ms=gscMonths();
  openDlg({title:"ดึงข้อมูลจาก Search Console",body:`<div class="note">Property: <b>${esc(g.siteUrl)}</b> · ข้อมูล Search Console มักช้ากว่าปัจจุบัน 2–3 วัน และย้อนหลังได้ 16 เดือน</div>
    <div class="row">${sel("เดือน","gsM",Object.fromEntries(ms.map(m=>[m,thMonth(m)+(monthRange(m).partial?" (ยังไม่จบเดือน)":"")])),ms[1])}${sel("มิติ","gsDim",{"query,page":"คีย์เวิร์ด × หน้า","query":"คีย์เวิร์ดอย่างเดียว","query,page,device":"คีย์เวิร์ด × หน้า × อุปกรณ์","query,page,country":"คีย์เวิร์ด × หน้า × ประเทศ"},"query,page")}${sel("จำนวนแถวสูงสุด","gsN",{100:"100",250:"250",500:"500",1000:"1,000"},"250")}</div>
    <div class="cnt">ระบบเรียงตาม Clicks จาก Search Console · แถวที่มีอยู่แล้ว (คีย์เวิร์ด/URL/เดือน/ประเทศ/อุปกรณ์เดียวกัน) จะอัปเดตเฉพาะตัวเลข ไม่แตะ Meta แผนปรับหน้า หรือ Q&A ที่ทีมเขียน</div><div id="gsOut"></div>`,
  foot:["|",{label:"ปิด"},{label:"ดึงข้อมูล",cls:"primary",act:async()=>{const m=V("gsM"),dims=V("gsDim").split(","),n=+V("gsN");const rg=monthRange(m);const out=$("#gsOut");
    out.innerHTML=`<div class="thinking"><div class="spin"></div>กำลังดึงข้อมูล ${thMonth(m)}…</div>`;
    let res;try{res=await mcp.callTool(GSC_SERVER,"gsc_search_analytics",{siteUrl:g.siteUrl,startDate:rg.start,endDate:rg.end,dimensions:dims,rowLimit:n,startRow:0,type:"web",dataState:"final"})}catch(e){out.innerHTML=`<div class="note bad">${esc(gscErr(e))}</div>`;return false}
    const rows=res?.payload?.rows;if(!Array.isArray(rows)){out.innerHTML=`<div class="note bad">ผลลัพธ์จาก Connector ไม่ตรงรูปแบบที่ตกลงไว้ (ไม่มี rows) — ไม่ได้บันทึกอะไร</div>`;return false}
    if(!rows.length){out.innerHTML=`<div class="note">Search Console ไม่มีข้อมูลของ ${thMonth(m)} (ไม่มีข้อมูลใหม่) — ไม่ได้บันทึกอะไร</div>`;return false}
    const src=`Search Console API · ${g.siteUrl}`;let add=0,up=0,bad=0;
    out.innerHTML=`<div class="thinking"><div class="spin"></div>บันทึก ${rows.length} แถว…</div>`;
    for(const r of rows){const k=r.keys||[];const get=d=>{const i=dims.indexOf(d);return i>=0?String(k[i]??""):""};
      const dev={MOBILE:"Mobile",DESKTOP:"Desktop",TABLET:"Tablet"}[get("device").toUpperCase()]||(dims.includes("device")?get("device"):"ทั้งหมด");
      const d={keyword:get("query"),url:get("page"),month:m,country:dims.includes("country")?get("country").toUpperCase():"ทั้งหมด",device:dev,
        clicks:Number.isFinite(r.clicks)?r.clicks:null,impressions:Number.isFinite(r.impressions)?r.impressions:null,position:Number.isFinite(r.position)?Math.round(r.position*10)/10:null,
        source:src,rangeFrom:rg.start,rangeTo:rg.end,fetchedAt:res.payload.fetchedAt||nowISO()};
      if(!d.keyword){bad++;continue}const id="K-"+hash(seoKey(d));
      try{if(S.seo.some(x=>x.id===id)){await dbUpd(COL.seo,id,{clicks:d.clicks,impressions:d.impressions,position:d.position,source:d.source,rangeFrom:d.rangeFrom,rangeTo:d.rangeTo,fetchedAt:d.fetchedAt});up++}else{await dbSetNew(COL.seo,id,d);add++}}catch(e){toast(dbErr(e));break}}

    S.ui.seoMonth=m;toast(`ดึงจาก Search Console: ใหม่ ${add} · อัปเดต ${up}${bad?` · ข้าม ${bad}`:""}${rg.partial?" · เดือนนี้ยังไม่จบ":""}`)}}]})};

const STAGES=[["idea","Idea"],["scripting","Scripting"],["producing","Producing"],["scheduled","Scheduled"],["published","Published"]];
const STAGE_N=Object.fromEntries(STAGES);

const stagePill=k=>`<span class="ch" style="--c:${STAGE_C[k]||"var(--muted)"}">${STAGE_N[k]||k}</span>`;
S.team=[];S.ideas=[];S.followers=[];S.fgoals=[];
COL.team="team";COL.ideas="ideas";COL.followers="followers";COL.fgoals="follower_goals";

ACT.aiHook=async()=>{if(!sample)return;const out=$("#hookOut");const topic=V("pHook")||V("pCap").slice(0,120);if(!topic){toast("ใส่หัวข้อก่อน");return}

  try{const r=await sample.json(`คิด Hook ภาษาไทย 5 แบบ สำหรับโพสต์ ${CH[V("pCh")]?.n||""} ของ ${S.brand?.name||"Delish Foods"} (ผักผลไม้พรีเมียม วัตถุดิบหายาก ไมโครกรีน ดอกไม้กินได้) หัวข้อ: ${topic}
Pillar: ${V("pPillar")||"-"} เป้าหมาย: ${GOALS[V("pGoal")]||"-"} · สั้นไม่เกิน 60 ตัวอักษร ห้ามอ้างสรรพคุณทางยา ห้ามแต่งตัวเลข/ราคา · ตอบ JSON: {"hooks":["..."]}`,{modelTier:"quick",cache:false});
    const hs=(r?.hooks||[]).filter(x=>typeof x==="string").slice(0,5);out.innerHTML=hs.length?`<div class="chips">${hs.map(h=>`<button type="button" class="btn sm" data-act="useHook">${esc(h)}</button>`).join("")}</div>`:`<div class="cnt">ไม่มีผลลัพธ์</div>`}
  catch(e){out.innerHTML=`<div class="note bad">${esc(aiErr(e))}</div>`}};

VIEWS.planner=()=>{const f=S.ui.pf||(S.ui.pf={});let rows=S.posts.filter(p=>(!f.stage||stageOf(p)===f.stage)&&(!f.ch||p.channel===f.ch)&&(!f.pillar||p.pillar===f.pillar)&&(!f.owner||p.owner===f.owner));
  rows.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));const pillars=[...new Set([...PILLARS,...S.posts.map(p=>p.pillar).filter(Boolean)])];const owners=[...new Set(S.posts.map(p=>p.owner).filter(Boolean))];
  const cnt=k=>S.posts.filter(p=>stageOf(p)===k).length;
  $("#v-planner").innerHTML=`<div class="vhead"><div><h1>Content Planner</h1><p>${S.posts.length} คอนเทนต์ · คลิกที่ขั้นตอนเพื่อเลื่อนไปขั้นถัดไป · ข้อมูลชุดเดียวกับปฏิทินและ AI คอนเทนต์</p></div><button class="btn primary" data-act="newPost" data-d="">＋ เพิ่มคอนเทนต์</button></div>
  <div class="panel"><div style="display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)">${STAGES.map(([k])=>cnt(k)?`<div style="flex:${cnt(k)};background:${STAGE_C[k]}"></div>`:"").join("")}</div>
    <div class="row" style="margin-top:10px">${STAGES.map(([k,n])=>`<button class="btn sm ${f.stage===k?"primary":""}" data-act="pfStage" data-k="${k}">${n} <b>${cnt(k)}</b></button>`).join("")}${f.stage?`<button class="btn sm ghost" data-act="pfStage" data-k="">ล้างตัวกรอง</button>`:""}</div></div>
  <div class="row"><select data-chg="pf" data-k="ch" style="width:auto"><option value="">ทุกแพลตฟอร์ม</option>${opt(CH,f.ch)}</select><select data-chg="pf" data-k="pillar" style="width:auto"><option value="">ทุก Pillar</option>${pillars.map(x=>`<option ${x===f.pillar?"selected":""}>${esc(x)}</option>`).join("")}</select><select data-chg="pf" data-k="owner" style="width:auto"><option value="">ทุกคน</option>${owners.map(x=>`<option ${x===f.owner?"selected":""}>${esc(x)}</option>`).join("")}</select><span class="spacer"></span><span class="cnt">แสดง ${rows.length} จาก ${S.posts.length}</span></div>
  <div class="panel" style="padding:0"><div class="tablewrap"><table><thead><tr><th>หัวข้อ / Hook</th><th>Pillar</th><th>แพลตฟอร์ม</th><th>เป้าหมาย</th><th>วันโพสต์</th><th>ผู้รับผิดชอบ</th><th>ขั้นตอน</th><th class="r">Reach</th></tr></thead><tbody>
  ${rows.map(p=>`<tr><td style="max-width:300px"><a href="#" data-act="editPost" data-id="${p.id}"><b>${esc(p.hook||String(p.caption||"").slice(0,60)||"(ไม่มีหัวข้อ)")}</b></a>${p.example?'<span class="ex">ตัวอย่าง</span>':""}<div class="cnt">${esc(p.source||"")}</div></td><td>${p.pillar?`<span class="tag">${esc(p.pillar)}</span>`:"-"}</td><td>${chip(p.channel)}</td><td class="cnt">${esc(GOALS[p.goal]||"-")}</td><td class="num">${p.date?thDate(p.date):"-"}</td><td>${esc(p.owner||"-")}</td>
    <td><button class="btn ghost sm" data-act="nextStage" data-id="${p.id}" title="เลื่อนไปขั้นถัดไป">${stagePill(stageOf(p))} ›</button></td><td class="r num">${fmtN(N(p.reach))}</td></tr>`).join("")||`<tr><td colspan="8"><div class="empty">ยังไม่มีคอนเทนต์ตามตัวกรอง</div></td></tr>`}</tbody></table></div></div>`};
ACT.pf=el=>{S.ui.pf[el.dataset.k]=el.value;forceRender()};ACT.pfStage=el=>{S.ui.pf.stage=el.dataset.k;forceRender()};
ACT.nextStage=async el=>{const p=S.posts.find(x=>x.id===el.dataset.id);const i=STAGES.findIndex(s=>s[0]===stageOf(p));const nx=STAGES[(i+1)%STAGES.length][0];
  if(nx==="scheduled"&&!p.date){toast("ใส่วันโพสต์ก่อนจึงตั้งเวลาได้");openPost(p);return}
  try{await dbUpd(COL.posts,p.id,{stage:nx,status:statusFromStage(nx)});toast("ย้ายไป "+STAGE_N[nx])}catch(e){toast(dbErr(e))}};

// ---------- PERFORMANCE ----------
const FPLAT=["facebook","instagram","tiktok","youtube","line"];
VIEWS.perf=()=>{const months=[...new Set(S.followers.map(r=>r.month))].sort().slice(-6);
  const byM=months.map(m=>{const rs=S.followers.filter(r=>r.month===m);const a=agg(rs,"followers");return{m,sum:a.sum,n:a.n,miss:FPLAT.length-rs.filter(r=>r.followers!=null).length}});const mx=Math.max(1,...byM.map(x=>x.sum||0));
  const latest=p=>S.followers.filter(r=>r.platform===p&&r.followers!=null).sort((a,b)=>b.month.localeCompare(a.month))[0];
  const goals=FPLAT.map(p=>({p,g:S.fgoals.find(x=>x.platform===p),l:latest(p)})).filter(x=>x.g||x.l);
  const reach=FPLAT.concat(["shopee"]).map(p=>{const a=agg(S.posts.filter(x=>x.channel===p),"reach");return{p,...a}}).filter(x=>x.n);const rmx=Math.max(1,...reach.map(x=>x.sum||0));
  const top=S.posts.filter(p=>N(p.reach)!=null).sort((a,b)=>N(b.reach)-N(a.reach)).slice(0,5);
  $("#v-perf").innerHTML=`<div class="vhead"><div><h1>Performance</h1><p>การเติบโตของผู้ติดตามทุกช่องทาง เทียบเป้ากับผลจริง และคอนเทนต์ที่ทำ Reach ได้ดีที่สุด</p></div><div class="row"><button class="btn" data-act="editGoals">ตั้งเป้าผู้ติดตาม</button><button class="btn primary" data-act="addFollowers">＋ บันทึกยอดผู้ติดตาม</button></div></div>
  <div class="note">ยอดผู้ติดตามและ Reach กรอกจากหน้า Insights ของแต่ละแพลตฟอร์ม (ยังไม่ได้เชื่อม API) ช่องที่ไม่กรอกไม่นับเป็น 0</div>
  <div class="g2"><div class="panel"><h2>ผู้ติดตามรวม · ${months.length||0} เดือนล่าสุด</h2>${byM.length?`<div class="vbars">${byM.map(x=>`<div class="vgrp" title="${thMonth(x.m)}: ${fmtN(x.sum)}${x.miss?` (ไม่มีข้อมูล ${x.miss} ช่องทาง)`:""}"><div class="pair"><div class="rev" style="height:${(x.sum||0)/mx*100}%;width:min(34px,70%)"></div></div></div>`).join("")}</div><div class="vlabels">${byM.map(x=>`<span>${TH_M[+x.m.slice(5)-1].slice(0,3)}<br><b class="num">${fmtK(x.sum)}</b>${x.miss?`<br><span style="color:var(--mango)">ขาด ${x.miss}</span>`:""}</span>`).join("")}</div>`:`<div class="empty">ยังไม่มียอดผู้ติดตาม กด “บันทึกยอดผู้ติดตาม”</div>`}</div>
    <div class="panel"><h2>เป้าผู้ติดตาม vs ผลจริง</h2>${goals.length?`<div class="bars">${goals.map(({p,g,l})=>{const pc=g&&l?l.followers/g.target*100:null;return`<div><div class="row" style="justify-content:space-between;font-size:13px"><span>${chip(p)}</span><span class="num">${l?fmtN(l.followers):"–"} / ${g?fmtN(g.target):"ยังไม่ตั้งเป้า"} ${pc!=null?`<b style="color:${pc>=90?"var(--accent)":"var(--mango)"}">(${Math.round(pc)}%)</b>`:""}</span></div><div class="track" style="height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${Math.min(pc||0,100)}%;background:${pc>=90?"var(--accent)":"var(--mango)"}"></div></div><div class="cnt">${l?"ข้อมูลเดือน "+thMonth(l.month):""}${g?.deadline?" · เป้าภายใน "+thDate(g.deadline):""}</div></div>`}).join("")}</div>`:`<div class="empty">ยังไม่มีเป้าหรือยอดผู้ติดตาม</div>`}</div></div>
  <div class="g2"><div class="panel"><h2>Reach แยกตามแพลตฟอร์ม (จากคอนเทนต์ที่กรอก Reach)</h2>${reach.length?`<div class="bars">${reach.sort((a,b)=>b.sum-a.sum).map(x=>`<div class="bar"><span class="lab">${CH[x.p]?.n||x.p}</span><div class="track"><div class="fill" style="width:${x.sum/rmx*100}%"></div></div><span class="v">${fmtK(x.sum)}</span></div>`).join("")}</div>`:`<div class="empty">ยังไม่มีคอนเทนต์ที่กรอก Reach</div>`}</div>
    <div class="panel"><h2>คอนเทนต์ที่ทำ Reach สูงสุด</h2>${top.length?`<table><thead><tr><th>#</th><th>หัวข้อ</th><th>แพลตฟอร์ม</th><th class="r">Reach</th></tr></thead><tbody>${top.map((p,i)=>`<tr class="clickable" data-act="editPost" data-id="${p.id}"><td class="num">${i+1}</td><td>${esc(p.hook||String(p.caption||"").slice(0,50))}${p.pillar?` <span class="tag">${esc(p.pillar)}</span>`:""}</td><td>${chip(p.channel)}</td><td class="r num">${fmtN(N(p.reach))}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">ยังไม่มีข้อมูล</div>`}</div></div>`};
ACT.addFollowers=()=>{const m0=today().slice(0,7);openDlg({title:"บันทึกยอดผู้ติดตาม",body:`${fld("เดือน","flM",m0,"month")}<div class="cnt">ใส่เฉพาะช่องทางที่ดูยอดมาแล้ว ช่องว่าง = ไม่บันทึก</div>${FPLAT.map(p=>{const ex=S.followers.find(r=>r.platform===p&&r.month===m0);return fld(CH[p].n,"fl_"+p,ex?.followers??"","number","min='0'")}).join("")}${fld("แหล่งข้อมูล","flSrc","Insights ของแต่ละแพลตฟอร์ม")}`,
  foot:["|",{label:"ยกเลิก"},{label:"บันทึก",cls:"primary",act:async()=>{const m=V("flM");if(!m)return false;let n=0;for(const p of FPLAT){const v=N(V("fl_"+p));if(v==null)continue;const id=p+"-"+m;
    const ex=S.followers.find(r=>r.id===id);if(ex)await dbUpd(COL.followers,id,{followers:v,source:V("flSrc")});else await dbSetNew(COL.followers,id,{platform:p,month:m,followers:v,source:V("flSrc")});n++}toast(`บันทึก ${n} ช่องทาง`)}}]})};
ACT.editGoals=()=>openDlg({title:"เป้าผู้ติดตาม",body:FPLAT.map(p=>{const g=S.fgoals.find(x=>x.platform===p);return`<div class="row">${fld(CH[p].n+" — เป้า","fg_"+p,g?.target??"","number","min='0'")}${fld("ภายในวันที่","fgd_"+p,g?.deadline||"","date")}</div>`}).join(""),
  foot:["|",{label:"ยกเลิก"},{label:"บันทึก",cls:"primary",act:async()=>{for(const p of FPLAT){const t=N(V("fg_"+p));const g=S.fgoals.find(x=>x.platform===p);if(t==null){if(g)await dbDel(COL.fgoals,g.id);continue}
    if(g)await dbUpd(COL.fgoals,g.id,{target:t,deadline:V("fgd_"+p)});else await dbSetNew(COL.fgoals,p,{platform:p,target:t,deadline:V("fgd_"+p)})}toast("บันทึกเป้าแล้ว")}}]});

async function genContent(e){e.preventDefault();if(!sample)return;const mode=V("gMode"),chans=$$('input[name="gch"]:checked').map(i=>i.value),brief=V("gBrief");if(!brief){toast("กรุณาใส่บรีฟ");return}

  const task=mode==="reply"?`สร้างชุดข้อความตอบคอมเมนต์/แชตลูกค้าที่พบบ่อย 6-8 ข้อ (ราคา จัดส่ง วิธีเก็บ ซื้อที่ไหน ติชม ร้องเรียน) ใส่คำถามลูกค้าใน hook และคำตอบใน caption`
    :mode==="ideas"?`เสนอไอเดียคอนเทนต์ 10 หัวข้อ หลากหลายรูปแบบ (สูตรอาหาร เบื้องหลังฟาร์ม UGC เทรนด์ โปร) ใส่ชื่อไอเดียใน hook รายละเอียดใน caption`
    :`เขียน${mode==="ad"?"ข้อความโฆษณา (primary text + headline ≤40 ตัวอักษรใน hook)":"โพสต์โซเชียล"} ช่องทาง ${chans.map(c=>CH[c].n).join(", ")} ช่องทางละ ${n} เวอร์ชันที่มุมต่างกัน`;
  try{const r=await sample.json(`คุณคือนักการตลาดออนไลน์มืออาชีพ\n${brandCtx()}\nกลุ่มลูกค้า: ${SEG[seg]} | โทน: ${tone} | ภาษา: ${lang}\n${chGuide}\nบรีฟ: ${brief}\nงาน: ${task}\nตอบเป็น JSON เท่านั้น: ${schema}`,{signal:aiCtl.signal,modelTier:"default"});
    S.lastGen=(r?.items||[]).map(it=>({...it,channel:CH[it.channel]?it.channel:(chans[0]||"facebook")}));renderVariants(mode)}
  catch(err){out.innerHTML=`<div class="note bad">${esc(aiErr(err))}</div>`}finally{$("#btnGen").disabled=false;$("#btnStop").hidden=true}}
